# Publishes the package to npm when a release is created.
# It uses npm trusted publishing, so there is no token to keep in secrets:
# https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm publish
